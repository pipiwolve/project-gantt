<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>项目进展甘特图</title>
<style>
:root{
  --canvas:#faf9f5; --soft:#f5f0e8; --card:#efe9de; --cream:#e8e0d2;
  --raise:#fffdf9;
  --hairline:#e6dfd8; --hairline-2:#ece7e0;
  --ink:#141413; --body:#3d3d3a; --muted:#6c6a64; --dim:#8e8b82;
  --accent:#cc785c; --accent-soft:#cc785c14; --accent-active:#a9583e;
  --ok:#5db872; --warn:#d4a017; --err:#c64545; --teal:#5db8a6;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --r:14px; --r-sm:9px;
  --lbl:208px;
  --sh:0 1px 2px #1414130a, 0 8px 24px -18px #14141324;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0}
body{background:var(--canvas); color:var(--body); font:14px/1.6 var(--sans); -webkit-font-smoothing:antialiased}
.page{max-width:1200px; margin:0 auto; padding:0 24px 64px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important; transition-duration:.01ms!important; scroll-behavior:auto!important}}

/* ---------- 页头 ---------- */
.hero{display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; padding:40px 0 22px}
.eyebrow{margin:0 0 8px; font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent)}
h1{margin:0; font-family:var(--serif); font-weight:400; font-size:34px; line-height:1.15; color:var(--ink); letter-spacing:.3px}
.lede{margin:12px 0 0; color:var(--muted); font-size:13px; max-width:64ch}
.lede code{font-family:var(--mono); font-size:12px; background:var(--soft); border:1px solid var(--hairline); padding:1px 6px; border-radius:5px; color:var(--body)}
.asof{text-align:right; font-family:var(--mono); font-size:11.5px; color:var(--dim); line-height:1.9; white-space:nowrap}
.asof b{display:block; font-family:var(--serif); font-size:20px; font-weight:400; color:var(--ink); letter-spacing:.5px}

/* ---------- 吸顶导航 ---------- */
.tabs{position:sticky; top:0; z-index:30; display:flex; gap:2px; flex-wrap:wrap;
  padding:10px 0; margin:0 0 24px; background:color-mix(in srgb, var(--canvas) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--hairline)}
.tab{appearance:none; border:0; background:none; font:inherit; font-size:12.5px; color:var(--muted);
  padding:5px 12px; border-radius:9999px; cursor:pointer; text-decoration:none; transition:background .16s, color .16s}
.tab:hover{background:var(--soft); color:var(--ink)}
.tab.on{background:var(--accent-soft); color:var(--accent-active)}
.tab span{font-family:var(--mono); font-size:10.5px; color:var(--dim); margin-left:6px}

/* ---------- KPI ---------- */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(146px,1fr)); gap:10px; margin-bottom:28px}
.stat{position:relative; background:var(--raise); border:1px solid var(--hairline); border-radius:var(--r);
  padding:13px 15px 14px; box-shadow:var(--sh)}
.stat::before{content:""; position:absolute; left:15px; right:15px; top:0; height:2px; border-radius:0 0 2px 2px; background:var(--hairline)}
.stat.warn::before{background:var(--warn)} .stat.miss::before{background:var(--err)}
.stat.ok::before{background:var(--ok)} .stat.acc::before{background:var(--accent)}
.stat b{display:block; font-family:var(--serif); font-weight:400; font-size:27px; line-height:1.15; color:var(--ink);
  font-variant-numeric:tabular-nums}
.stat span{display:block; margin-top:3px; font-size:11.5px; color:var(--muted)}
.stat.warn b{color:#a97c0d} .stat.miss b{color:var(--err)} .stat.ok b{color:#3f8a52} .stat.acc b{color:var(--accent-active)}

/* ---------- 卡片 ---------- */
.card{background:var(--raise); border:1px solid var(--hairline); border-radius:var(--r); padding:20px 22px;
  margin-bottom:16px; box-shadow:var(--sh); scroll-margin-top:66px}
.card > h2{margin:0 0 4px; font-family:var(--serif); font-weight:400; font-size:18px; color:var(--ink); display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.card > h2 small{font-family:var(--mono); font-size:11.5px; color:var(--dim); font-weight:400}
.card-sub{margin:0 0 16px; font-size:12px; color:var(--muted)}

.empty{padding:22px 2px 6px; color:var(--dim); font-size:13px; max-width:66ch}
.empty b{display:block; font-family:var(--serif); font-size:19px; color:var(--ink); font-weight:400; margin-bottom:8px}
.empty code{font-family:var(--mono); font-size:12px; background:var(--soft); padding:1px 6px; border-radius:5px; color:var(--body)}

/* ---------- 时间线 ---------- */
.legend{display:flex; gap:16px; flex-wrap:wrap; margin:0 0 14px; font-size:11.5px; color:var(--muted)}
.legend i{display:inline-block; width:16px; height:8px; border-radius:4px; margin-right:5px; vertical-align:middle}
.legend i.b{background:var(--teal)} .legend i.o{background:var(--err)}
.legend i.m{width:9px; height:9px; border-radius:50%; background:var(--raise); border:2px solid var(--accent)}
.legend i.d{background:var(--card); border:1px solid var(--hairline)}

.scroll{overflow-x:auto; margin:0 -22px; padding:0 22px}
.chart{min-width:680px}
.axis{display:grid; grid-template-columns:var(--lbl) 1fr; align-items:end; margin-bottom:8px}
.ticks{position:relative; height:18px; border-bottom:1px solid var(--hairline)}
.tick{position:absolute; top:0; font-family:var(--mono); font-size:10.5px; color:var(--dim); transform:translateX(-50%); white-space:nowrap}
.tick:first-child{transform:none}
.tick:last-child{transform:translateX(-100%)}

.rows{position:relative}
.bands{position:absolute; left:var(--lbl); right:0; top:0; bottom:0; pointer-events:none; overflow:hidden}
.band{position:absolute; top:0; bottom:0; background:#14141305}
.gline{position:absolute; top:0; bottom:0; width:1px; background:var(--hairline-2)}
.today{position:absolute; top:-6px; bottom:0; width:2px; background:var(--accent); opacity:.5}
.todaylab{position:absolute; top:-18px; font-family:var(--mono); font-size:10px; color:var(--accent-active);
  background:var(--canvas); padding:0 4px; transform:translateX(-50%); white-space:nowrap; z-index:2}
.todaylab.lft{transform:translateX(-100%)}

.grp{display:grid; grid-template-columns:var(--lbl) 1fr; align-items:center; padding:12px 0 4px;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim)}
.grp span{border-bottom:1px solid var(--hairline); padding-bottom:4px}

.row{display:grid; grid-template-columns:var(--lbl) 1fr; align-items:center; min-height:38px; position:relative;
  border-top:1px solid var(--hairline-2); transition:background .14s}
.row:hover{background:var(--soft)}
.name{font-size:12.5px; color:var(--ink); padding-right:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  display:flex; align-items:center; gap:6px}
.name i{font-style:normal; flex:0 0 auto; font-family:var(--mono); font-size:10px; color:var(--muted);
  background:var(--soft); border:1px solid var(--hairline); border-radius:9999px; padding:0 6px}
.track{position:relative; height:38px}

.bar{position:absolute; top:11px; height:16px; border-radius:8px; background:var(--teal); min-width:3px;
  box-shadow:0 1px 3px #5db8a633}
.bar.over{background:var(--err); box-shadow:0 1px 3px #c6454533}
.bar.done{background:var(--card); border:1px solid var(--hairline); box-shadow:none}
.bar.mile{top:14px; height:10px; width:10px!important; border-radius:50%; background:var(--raise);
  border:2.5px solid var(--accent); transform:translateX(-5px); box-shadow:0 0 0 3px var(--accent-soft)}
.bar.mile.over{border-color:var(--err); box-shadow:0 0 0 3px #c645451f}
.bar .lbl{position:absolute; left:calc(100% + 9px); top:-2px; font-family:var(--mono); font-size:10.5px; color:var(--muted); white-space:nowrap}
.bar .lbl.lft{left:auto; right:calc(100% + 9px)}
.bar .lbl.over{color:var(--err)} .bar .lbl.soon{color:#a97c0d}
.bar .lbl.now{color:var(--accent-active)} .bar .lbl.done{color:var(--dim)}
.bar .inl{position:absolute; left:10px; top:0; line-height:16px; font-size:10.5px; color:#fff; white-space:nowrap}

/* ---------- 表格 ---------- */
table{width:100%; border-collapse:collapse; font-size:12.5px}
th,td{border-bottom:1px solid var(--hairline-2); padding:9px 10px; text-align:left; vertical-align:top}
th{font-weight:500; color:var(--muted); font-size:11px; letter-spacing:.04em; text-transform:uppercase;
  position:sticky; top:52px; background:var(--raise); z-index:5}
tbody tr:hover{background:var(--soft)}
tbody tr:last-child td{border-bottom:0}
td.mono{font-family:var(--mono); font-size:11.5px; color:var(--body); white-space:nowrap; font-variant-numeric:tabular-nums}
td .sub{display:block; color:var(--dim); font-size:11.5px; margin-top:3px}
.pill{display:inline-block; padding:1px 8px; border-radius:9999px; font-size:10.5px; font-family:var(--mono);
  background:var(--soft); color:var(--muted); border:1px solid var(--hairline); white-space:nowrap}
.pill.ok{background:#5db87214; color:#3f8a52; border-color:#5db87238}
.pill.over{background:#c6454514; color:var(--err); border-color:#c6454538}
.todo{display:block; color:var(--body); font-size:12px; padding:2px 0}
.todo + .todo{border-top:1px dashed var(--hairline)}

/* ---------- 新增文件 ---------- */
.toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 18px}
.seg{display:inline-flex; background:var(--soft); border:1px solid var(--hairline); border-radius:9999px; padding:2px}
.seg button{appearance:none; border:0; background:none; font:inherit; font-size:12px; color:var(--muted);
  padding:4px 11px; border-radius:9999px; cursor:pointer; font-variant-numeric:tabular-nums; transition:background .16s, color .16s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--raise); color:var(--ink); box-shadow:0 1px 2px #14141314}
.seg button em{font-style:normal; font-family:var(--mono); font-size:10px; color:var(--dim); margin-left:4px}
.seg button.on em{color:var(--accent)}
.filt{flex:1 1 190px; min-width:150px; appearance:none; font:inherit; font-size:12.5px; color:var(--ink);
  background:var(--raise); border:1px solid var(--hairline); border-radius:var(--r-sm); padding:7px 11px}
.filt::placeholder{color:var(--dim)}
.count{font-family:var(--mono); font-size:11.5px; color:var(--dim); white-space:nowrap}

.proj{border:1px solid var(--hairline); border-radius:var(--r); margin-bottom:12px; overflow:hidden; background:var(--raise)}
.proj > summary{cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:11px 15px; background:var(--soft); border-bottom:1px solid var(--hairline)}
.proj > summary::-webkit-details-marker{display:none}
.proj > summary::before{content:"▸"; font-size:10px; color:var(--dim); transition:transform .16s}
.proj[open] > summary::before{transform:rotate(90deg)}
.proj h3{margin:0; font-size:13.5px; font-weight:500; color:var(--ink)}
.proj .n{font-family:var(--mono); font-size:10.5px; color:var(--muted); background:var(--raise);
  border:1px solid var(--hairline); border-radius:9999px; padding:0 7px}
.proj .range{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--dim)}
.proj .other{font-size:11.5px; color:var(--dim); padding:8px 15px 0}

.f{display:grid; grid-template-columns:82px 1fr; gap:14px; padding:11px 15px; border-bottom:1px solid var(--hairline-2)}
.f:last-child{border-bottom:0}
.f:hover{background:var(--soft)}
.f-meta{font-family:var(--mono); font-size:10.5px; color:var(--dim); line-height:1.7}
.f-meta .pill{margin-top:4px}
.f-title{font-size:13px; color:var(--ink); margin-bottom:3px; word-break:break-word}
.f-path{font-family:var(--mono); font-size:10.5px; color:var(--dim); margin-bottom:5px; word-break:break-all}
.f-sum{font-size:12.5px; color:var(--body)}
.f-src{font-family:var(--mono); font-size:9.5px; color:var(--dim); border:1px solid var(--hairline-2);
  border-radius:4px; padding:0 4px; margin-left:6px; white-space:nowrap}
.f-none{font-size:12px; color:var(--dim); font-style:italic}
.none{padding:26px 15px; text-align:center; color:var(--dim); font-size:12.5px}

footer{margin-top:30px; padding-top:14px; border-top:1px solid var(--hairline);
  color:var(--dim); font-size:11.5px; font-family:var(--mono); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}

@media (max-width:760px){
  .page{padding:0 16px 48px}
  .hero{padding:28px 0 16px} h1{font-size:26px}
  .asof{text-align:left}
  :root{--lbl:124px}
  .chart{min-width:600px}
  .scroll{margin:0 -16px; padding:0 16px}
  th{position:static}
  .f{grid-template-columns:1fr; gap:6px}
  .f-meta{display:flex; align-items:center; gap:8px}
  .f-meta .pill{margin-top:0}
}
@media print{
  body{background:#fff}
  .tabs,.toolbar{display:none}
  .card{box-shadow:none; break-inside:avoid; border-color:#ddd}
  .proj{break-inside:avoid}
  .proj > summary{background:#f7f7f7}
  .row:hover,.tbody tr:hover,.f:hover{background:none}
  a{text-decoration:none; color:inherit}
}
</style>

const DAY = 86400000;
const ms = (s) => new Date(s + 'T00:00:00Z').getTime();
const fmt = (t) => new Date(t).toISOString().slice(5, 10).replace('-', '/');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const NOW = ms(DATA.today);

const rows = DATA.rows;
const dated = rows.filter((r) => r.start || r.due);
const undated = rows.filter((r) => !r.start && !r.due);
const s = DATA.stat;

document.getElementById('asof').textContent = DATA.today;
document.getElementById('gen').textContent = 'gantt-assistant';

// ---------- KPI ----------
const recentFiles = (DATA.recent && DATA.recent.files) || [];
const week = recentFiles.filter((f) => ms(f.made) >= NOW - 6 * DAY).length;
const tiles = [
  ['', s.total, '总行数'],
  ['', s.scheduled, '已排期（有起止）'],
  [s.milestone ? 'warn' : '', s.milestone, '只有单端日期'],
  [s.unscheduled ? 'miss' : '', s.unscheduled, '待补起止'],
  ['ok', s.finished || 0, '已完成（不显示）'],
  ['acc', week, '近 7 天新增文件'],
];
document.getElementById('stats').innerHTML = tiles
  .map(([c, v, t]) => '<div class="stat ' + c + '"><b>' + v + '</b><span>' + t + '</span></div>').join('');

const body = document.getElementById('body');
const nav = [];

// ---------- 时间线 ----------
function timeline() {
  if (!dated.length) {
    return '<div class="card" id="s-timeline"><h2>时间线</h2><div class="empty">'
      + '<b>缺的是日期，不是图</b>'
      + '采集和渲染都通了：读到了 <code>' + s.total + '</code> 行，其中客户项目来自 <code>20_客户项目/</code> 的索引，'
      + '关联到项目的提醒 <code>' + (s.reminders - s.unmatched) + '/' + s.reminders + '</code> 条。'
      + '但这些项目既没有开始日期也没有截止日期，提醒事项那边也没有填截止日的，所以画不出条。'
      + '<br><br>补一句话就行，比如「箭牌 9/20 到 9/30」，我把日期写进 <code>schedule.json</code> 再重跑。'
      + '</div></div>';
  }

  // 日期域，两端各留一天，免得条贴边
  let lo = Infinity, hi = -Infinity;
  for (const r of dated) for (const d of [r.start, r.due]) if (d) { lo = Math.min(lo, ms(d)); hi = Math.max(hi, ms(d)); }
  lo -= DAY; hi += DAY;
  const span = hi - lo;
  const pct = (t) => ((t - lo) / span) * 100;
  const side = (p) => (p > 74 ? ' lft' : '');

  // 刻度跨度大就按月，小就按天
  const days = Math.round(span / DAY);
  const step = days > 120 ? 30 : days > 45 ? 14 : days > 14 ? 7 : 1;
  let ticks = '', lines = '', bands = '';
  for (let t = lo, i = 0; t <= hi; t += step * DAY, i++) {
    const p = pct(t);
    ticks += '<div class="tick" style="left:' + p + '%">' + fmt(t) + '</div>';
    lines += '<div class="gline" style="left:' + p + '%"></div>';
    // 隔列加一层极淡底色，读横向位置时不用一路数到刻度
    if (i % 2) bands += '<div class="band" style="left:' + p + '%;width:' + ((step * DAY / span) * 100) + '%"></div>';
  }
  const todayLine = (NOW >= lo && NOW <= hi)
    ? '<div class="today" style="left:' + pct(NOW) + '%"></div><div class="todaylab' + side(pct(NOW)) + '" style="left:' + pct(NOW) + '%">今天</div>'
    : '';

  // 状态并进那一个日期标签里。之前另放一个 chip，结果和日期标签叠在一起，
  // 还把「创建」说了两遍，渲染出来是「09/21 截止逾期」这种糊成一片的东西。
  const status = (r) => {
    if (r.status === 'done') return { text: '已完成', cls: ' done' };
    if (!r.due) return null;
    const d = Math.round((ms(r.due) - NOW) / DAY);
    if (d < 0) return { text: '逾期 ' + (-d) + ' 天', cls: ' over' };
    if (d === 0) return { text: '今天到期', cls: ' now' };
    if (d <= 7) return { text: '剩 ' + d + ' 天', cls: ' soon' };
    return null;
  };

  const rowHtml = (r) => {
    const done = r.status === 'done';
    const over = r.due && r.due < DATA.today && !done;
    const badge = r.items.length ? '<i>' + r.items.length + ' 项</i>' : '';
    const st = status(r);
    const tail = st ? ' · ' + st.text : '';
    const cls = st ? st.cls : '';
    let bar;
    if (r.kind === 'bar') {
      const a = pct(ms(r.start)), b = pct(ms(r.due));
      const w = Math.max(b - a, 0.6);
      const label = r.items.length ? r.items.length + ' 项待办' : '';
      bar = '<div class="bar' + (over ? ' over' : '') + (done ? ' done' : '') + '" style="left:' + a + '%;width:' + w + '%">'
        + (label && w > 17 ? '<span class="inl">' + label + '</span>' : '')
        + '<span class="lbl' + side(b) + cls + '">' + fmt(ms(r.start)) + '–' + fmt(ms(r.due)) + tail + '</span></div>';
    } else {
      const at = pct(ms(r.due || r.start));
      bar = '<div class="bar mile' + (over ? ' over' : '') + '" style="left:' + at + '%"><span class="lbl' + side(at) + cls + '">'
        + fmt(ms(r.due || r.start)) + (r.due ? ' 截止' : ' 创建') + tail + '</span></div>';
    }
    return '<div class="row"><div class="name" title="' + esc(r.title) + '"><span style="overflow:hidden;text-overflow:ellipsis">'
      + esc(r.title) + '</span>' + badge + '</div>'
      + '<div class="track">' + bar + '</div></div>';
  };

  const bars = dated.filter((r) => r.kind === 'bar');
  const miles = dated.filter((r) => r.kind !== 'bar');
  let rowsHtml = '';
  if (bars.length) rowsHtml += '<div class="grp"><span>已排期 · ' + bars.length + '</span><span></span></div>' + bars.map(rowHtml).join('');
  if (miles.length) rowsHtml += '<div class="grp"><span>单端日期 · ' + miles.length + '</span><span></span></div>' + miles.map(rowHtml).join('');

  // 图例只列图上真有的东西，别为一个 0 条的类别留个色块
  const legend = [
    bars.length ? '<span><i class="b"></i>已排期</span>' : '',
    miles.length ? '<span><i class="m"></i>单端日期</span>' : '',
    dated.some((r) => r.due && r.due < DATA.today && r.status !== 'done') ? '<span><i class="o"></i>已逾期</span>' : '',
    dated.some((r) => r.status === 'done') ? '<span><i class="d"></i>已完成</span>' : '',
  ].filter(Boolean).join('');

  return '<div class="card" id="s-timeline"><h2>时间线<small>' + fmt(lo + DAY) + ' – ' + fmt(hi - DAY) + '</small></h2>'
    + (legend ? '<div class="legend">' + legend + '</div>' : '')
    + '<div class="scroll"><div class="chart">'
    + '<div class="axis"><div></div><div class="ticks">' + ticks + '</div></div>'
    + '<div class="rows"><div class="bands">' + bands + '</div>' + todayLine + lines + rowsHtml + '</div>'
    + '</div></div></div>';
}

// ---------- 明细表 ----------
const titleCell = (r) => '<td>' + esc(r.title) + (r.project ? '<span class="sub">' + esc(r.project) + '</span>' : '') + '</td>';
const itemsCell = (r) => '<td>' + (r.items.length
  ? r.items.map((i) => '<span class="todo">' + esc(i.name) + (i.done ? ' ✓' : '') + '</span>').join('')
  : '<span style="color:var(--dim)">—</span>') + '</td>';
const noteCell = (r) => '<td>' + (r.note && r.note !== '未归类'
  ? esc(r.note) : '<span style="color:var(--dim)">' + esc(r.note || '—') + '</span>') + '</td>';
// 逾期单独标出来，别让人自己去和今天比
const dueCell = (r) => {
  if (!r.due) return '<td class="mono">—</td>';
  const over = r.due < DATA.today && r.status !== 'done';
  return '<td class="mono">' + r.due + (over ? ' <span class="pill over">逾期</span>' : '') + '</td>';
};

function tables() {
  let html = '';
  if (dated.length) {
    html += '<div class="card" id="s-dated"><h2>有日期的条目<small>' + dated.length + ' 项</small></h2>'
      + '<table><thead><tr><th>条目</th><th>开始</th><th>截止</th><th>进展 / 说明</th><th>关联待办</th></tr></thead><tbody>'
      + dated.map((r) => '<tr>' + titleCell(r)
        + '<td class="mono">' + (r.start || '—') + '</td>' + dueCell(r)
        + noteCell(r) + itemsCell(r) + '</tr>').join('')
      + '</tbody></table></div>';
  }
  if (undated.length) {
    html += '<div class="card" id="s-undated"><h2>待补起止<small>' + undated.length + ' 项</small></h2>'
      + '<p class="card-sub">这些项目还没有起止日期，补一句话就能上图。</p>'
      + '<table><thead><tr><th>项目</th><th>状态</th><th>进展 / 说明</th><th>关联待办</th></tr></thead><tbody>'
      + undated.map((r) => '<tr>' + titleCell(r) + '<td><span class="pill">' + esc(r.status || '—') + '</span></td>'
        + noteCell(r) + itemsCell(r) + '</tr>').join('')
      + '</tbody></table></div>';
  }
  return html;
}

// ---------- 新增文件 ----------
// 摘要是从笔记自己身上取的（frontmatter 的 summary / ## 摘要 段），
// 取不到才退回正文首段，并且标出来源，不假装是作者写的摘要。
const WINDOWS = [1, 3, 7, 14, 30];
const rec = DATA.recent || { windowDays: 30, files: [], others: {} };
const recMax = rec.windowDays || 30;
const others = rec.others || {};
let win = WINDOWS.includes(7) && recMax >= 7 ? 7 : recMax;
let query = '';

function inWindow(f) { return ms(f.made) >= NOW - (win - 1) * DAY; }

function filesSection() {
  const maxDay = recMax;
  const segs = WINDOWS.filter((w) => w <= maxDay).map((w) => {
    const n = recentFiles.filter((f) => ms(f.made) >= NOW - (w - 1) * DAY).length;
    return '<button data-win="' + w + '"' + (w === win ? ' class="on"' : '') + '>' + w + ' 天<em>' + n + '</em></button>';
  }).join('');

  const list = recentFiles.filter(inWindow);
  const q = query.trim().toLowerCase();
  const hit = (f) => !q || ((f.title || '') + f.name + f.rel + (f.summary || '') + (f.type || '')).toLowerCase().includes(q);
  const shown = list.filter(hit);

  // 按项目分组，条目多的排前面
  const groups = new Map();
  for (const f of shown) {
    if (!groups.has(f.project)) groups.set(f.project, []);
    groups.get(f.project).push(f);
  }
  const ordered = [...groups.entries()].sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0], 'zh'));

  const fileRow = (f) => {
    const dir = f.rel.split('/').slice(1, -1).join(' / ');
    return '<div class="f"><div class="f-meta">' + f.made.slice(5)
      + (f.type ? '<br><span class="pill">' + esc(f.type) + '</span>' : '') + '</div>'
      + '<div><div class="f-title">' + esc(f.title || f.name.replace(/\.[^.]+$/, '')) + '</div>'
      + (dir ? '<div class="f-path">' + esc(dir) + '</div>' : '')
      + (f.summary
        ? '<div class="f-sum">' + esc(f.summary) + '<span class="f-src">' + esc(f.from || '摘要') + '</span></div>'
        : '<div class="f-none">这个文件没有可取正文的摘要段，只登记文件名。</div>')
      + '</div></div>';
  };

  const groupsHtml = ordered.length
    ? ordered.map(([proj, fs]) => {
      const dates = fs.map((f) => f.made).sort();
      const other = others[proj] || 0;
      return '<details class="proj" open><summary><h3>' + esc(proj) + '</h3><span class="n">' + fs.length + '</span>'
        + (other ? '<span class="other">另有 ' + other + ' 个非文本文件</span>' : '')
        + '<span class="range">' + dates[0].slice(5) + ' – ' + dates[dates.length - 1].slice(5) + '</span></summary>'
        + fs.map(fileRow).join('') + '</details>';
    }).join('')
    : '<div class="none">这个范围里没有新增文件。</div>';

  const total = list.length;
  return '<div class="card" id="s-files"><h2>新增文件<small>近 ' + win + ' 天 · ' + shown.length + ' / ' + total + ' 篇</small></h2>'
    + '<p class="card-sub">扫 <code style="font-family:var(--mono);font-size:12px">20_客户项目/</code> 下新出现的文本文件，摘要取自笔记自身的 summary 或摘要段。隐藏目录（agent 脚手架）与 SCHEMA §2.1 豁免的 demo / tools 目录不计入。</p>'
    + '<div class="toolbar"><div class="seg" id="seg">' + segs + '</div>'
    + '<input class="filt" id="filt" type="search" placeholder="按标题、路径、摘要过滤…" value="' + esc(query) + '">'
    + '<span class="count" id="cnt">' + ordered.length + ' 个项目</span></div>'
    + '<div id="flist">' + groupsHtml + '</div></div>';
}

// ---------- 组装 ----------
parts.push(timeline());
parts.push(tables());
if (recentFiles.length || Object.keys(others).length) parts.push(filesSection());
body.innerHTML = parts.join('');

// ---------- 导航 ----------
function buildNav() {
  const items = [['s-timeline', '时间线'], ['s-dated', '有日期条目'], ['s-undated', '待补起止'], ['s-files', '新增文件']];
  const live = items.filter(([id]) => document.getElementById(id));
  document.getElementById('tabs').innerHTML = live.map(([id, label]) => {
    const card = document.getElementById(id);
    const n = (card.querySelector('h2 small') || {}).textContent || '';
    return '<a class="tab" href="#' + id + '">' + label + (n ? '<span>' + esc(n.split('·')[0].trim()) + '</span>' : '') + '</a>';
  }).join('');
  // 滚到哪一节就点亮哪个 tab
  const tabs = [...document.querySelectorAll('.tab')];
  const io = new IntersectionObserver((es) => {
    for (const e of es) if (e.isIntersecting) {
      tabs.forEach((t) => t.classList.toggle('on', t.getAttribute('href') === '#' + e.target.id));
    }
  }, { rootMargin: '-70px 0px -70% 0px' });
  live.forEach(([id]) => io.observe(document.getElementById(id)));
}
if (document.getElementById('tabs')) buildNav();

// ---------- 新增文件交互 ----------
const seg = document.getElementById('seg');
if (seg) {
  seg.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-win]');
    if (!b) return;
    win = Number(b.dataset.win);
    redraw();
  });
}
const filt = document.getElementById('filt');
if (filt) {
  filt.addEventListener('input', () => { query = filt.value; redraw(true); });
}
// 只重画列表本身：重建整节会丢掉输入框焦点和滚动位置
function redraw(keepFocus) {
  const card = document.getElementById('s-files');
  if (!card) return;
  const fresh = document.createElement('div');
  fresh.innerHTML = filesSection();
  const next = fresh.firstElementChild;
  ['#seg', '#flist', '#cnt'].forEach((sel) => {
    const a = card.querySelector(sel), b = next.querySelector(sel);
    if (a && b) a.replaceWith(b);
  });
  card.querySelector('h2 small').textContent = next.querySelector('h2 small').textContent;
  if (keepFocus && filt) {
    const v = filt.value;
    filt.value = v;
    filt.focus();
  }
}

document.getElementById('foot').innerHTML = '<span>generated ' + DATA.today + ' · gantt-assistant</span>'
  + '<span>提醒命中 ' + (s.reminders - s.unmatched) + '/' + s.reminders + ' · 未归类 ' + s.unmatched + '</span>';
</script>
</body></html>
